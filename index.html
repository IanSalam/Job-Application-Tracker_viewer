<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>

  <!-- Ikon tab (emoji kecil). Baris lama memakai href="-" sehingga browser mencari file bernama "-" yang tidak ada. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">

  <!--
    HALAMAN PEMBUNGKUS UNTUK GITHUB PAGES
    Halaman ini hanya menampilkan web app Google Apps Script (project PENONTON) di dalam sebuah bingkai
    layar penuh, supaya alamat yang dibagikan pendek (alamat github.io milikmu).

    SYARAT AGAR TAMPIL: di Code.gs project penonton, doGet() harus memakai
        .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
    lalu deploy versi baru. Tanpa itu, bingkai kosong dengan tulisan "script.google.com refused to connect".

    MAU MENGGANTI ALAMAT WEB APP?  Ubah alamat pada atribut src di bawah (harus berakhiran /exec).
  -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #f2f4f1; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100dvh; border: 0; }   /* dvh = tinggi layar yang benar di browser HP */
  </style>
</head>
<body>
  <iframe
    id="app"
    title="Job Application Tracker"
   src="https://script.google.com/macros/s/AKfycbzl2EMCBVjEhLEkvj0YcYPxPna43NbbzjiNokW1fGASvC3MIoMLI-mWSjXQr-0tJhsy/exec"
    allow="fullscreen"></iframe>
</body>
</html>
